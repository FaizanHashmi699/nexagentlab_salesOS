[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "salesos"
version = "0.1.0"
description = "NexAgentLab SalesOS — Autonomous AI Sales System"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "pydantic>=2.0",
    "requests>=2.28",
    "beautifulsoup4>=4.12",
    "jinja2>=3.1",
    "httpx>=0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
ai = [
    "google-genai>=1.0",
]

[project.scripts]
salesos = "salesos.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"
